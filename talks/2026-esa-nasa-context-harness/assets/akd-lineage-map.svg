<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="sans-serif">
  <defs>
    <style>
      .bg { fill: #faf8f3; }
      .title { fill: #1f2937; font-size: 38px; font-weight: 700; }
      .subtitle { fill: #4b5563; font-size: 19px; font-style: italic; }
      .col-h { fill: #1f2937; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .box { stroke-width: 2.5; rx: 10; ry: 10; }
      .ext-box { fill: #e8f0fe; stroke: #0B3D91; }
      .akd-box { fill: #ecfdf5; stroke: #047857; }
      .orig-box { fill: #fff8ef; stroke: #FF6F00; }
      .ext-text { fill: #0B3D91; font-size: 22px; font-weight: 700; }
      .akd-text { fill: #1f2937; font-size: 18px; font-weight: 600; }
      .orig-text { fill: #FF6F00; font-size: 20px; font-weight: 700; }
      .orig-badge { fill: #FF6F00; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .arrow { stroke: #6b7280; stroke-width: 2; fill: none; }
      .footer { fill: #6b7280; font-size: 17px; font-style: italic; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- Subtitle / framing line -->
  <text x="800" y="55" class="subtitle" text-anchor="middle">arrows show what borrows from where; right-side boxes with no arrow are AKD-original</text>

  <!-- Column headers -->
  <text x="320" y="110" class="col-h" text-anchor="middle">EXTERNAL PATTERNS</text>
  <text x="1280" y="110" class="col-h" text-anchor="middle">PRIMITIVES IN PRACTICE</text>

  <!-- LEFT COLUMN — external systems -->
  <rect class="box ext-box" x="80" y="170" width="480" height="60"/>
  <text x="320" y="208" class="ext-text" text-anchor="middle">Claude Code</text>

  <rect class="box ext-box" x="80" y="300" width="480" height="60"/>
  <text x="320" y="338" class="ext-text" text-anchor="middle">LangGraph</text>

  <rect class="box ext-box" x="80" y="430" width="480" height="60"/>
  <text x="320" y="468" class="ext-text" text-anchor="middle">Deep Research</text>

  <rect class="box ext-box" x="80" y="560" width="480" height="60"/>
  <text x="320" y="598" class="ext-text" text-anchor="middle">Anthropic Skills</text>

  <rect class="box ext-box" x="80" y="690" width="480" height="60"/>
  <text x="320" y="728" class="ext-text" text-anchor="middle">Sakana AI Scientist</text>

  <!-- RIGHT COLUMN — AKD primitives -->
  <rect class="box akd-box" x="1040" y="150" width="480" height="50"/>
  <text x="1280" y="182" class="akd-text" text-anchor="middle">Artifact-driven context</text>

  <rect class="box akd-box" x="1040" y="235" width="480" height="50"/>
  <text x="1280" y="267" class="akd-text" text-anchor="middle">Deterministic harness + HITL</text>

  <rect class="box akd-box" x="1040" y="320" width="480" height="50"/>
  <text x="1280" y="352" class="akd-text" text-anchor="middle">Checkpointed runs · typed events</text>

  <rect class="box akd-box" x="1040" y="405" width="480" height="50"/>
  <text x="1280" y="437" class="akd-text" text-anchor="middle">Plan → retrieve → synthesize</text>

  <rect class="box akd-box" x="1040" y="485" width="480" height="60"/>
  <text x="1280" y="510" class="akd-text" text-anchor="middle">Benchmarking</text>
  <text x="1280" y="532" class="orig-badge" fill="#4b5563" letter-spacing="1px" text-anchor="middle">SYNTHETIC + CURATED · TOOL · HARNESS · AGENT</text>

  <rect class="box akd-box" x="1040" y="575" width="480" height="50"/>
  <text x="1280" y="607" class="akd-text" text-anchor="middle">Staged scientific pipeline</text>

  <!-- AKD-original — composable guardrails -->
  <rect class="box orig-box" x="1040" y="660" width="480" height="60"/>
  <text x="1280" y="687" class="orig-text" text-anchor="middle">Composable guardrails</text>
  <text x="1280" y="708" class="orig-badge" text-anchor="middle">AKD-ORIGINAL</text>

  <!-- AKD-original — CARE methodology -->
  <rect class="box orig-box" x="1040" y="745" width="480" height="60"/>
  <text x="1280" y="772" class="orig-text" text-anchor="middle">CARE methodology</text>
  <text x="1280" y="793" class="orig-badge" text-anchor="middle">AKD-ORIGINAL</text>

  <!-- ARROWS -->
  <!-- Claude Code (center 200) → Artifact-driven context (center 175) -->
  <path class="arrow" d="M 560 195 C 760 195, 840 175, 1040 175" marker-end="url(#arrow)"/>
  <!-- Claude Code (center 200) → Deterministic harness + HITL (center 260) -->
  <path class="arrow" d="M 560 215 C 760 230, 840 255, 1040 260" marker-end="url(#arrow)"/>
  <!-- LangGraph (center 330) → Checkpointed runs (center 345) -->
  <path class="arrow" d="M 560 330 C 760 335, 840 343, 1040 345" marker-end="url(#arrow)"/>
  <!-- OpenAI Deep Research (center 460) → Plan → retrieve → synthesize (center 430) -->
  <path class="arrow" d="M 560 460 C 760 450, 840 432, 1040 430" marker-end="url(#arrow)"/>
  <!-- Anthropic Skills (center 590) → Artifact-driven context (center 175) -->
  <path class="arrow" d="M 560 590 C 760 590, 760 175, 1040 175" marker-end="url(#arrow)"/>
  <!-- Sakana (center 720) → Benchmarking (center 515) -->
  <path class="arrow" d="M 560 720 C 760 700, 820 540, 1040 515" marker-end="url(#arrow)"/>
  <!-- Sakana (center 720) → Staged scientific pipeline (center 605) -->
  <path class="arrow" d="M 560 720 C 760 720, 840 615, 1040 605" marker-end="url(#arrow)"/>

  <!-- Dotted link: Artifact-driven context → CARE methodology (CARE produces artifacts) -->
  <path d="M 1520 175 C 1580 175, 1580 775, 1520 775" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="5,4"/>

  <!-- Footer -->
  <text x="800" y="860" class="footer" text-anchor="middle">composable guardrails — input + output (safety · risk · factuality · attribution); chain with and · or · fail-fast operators.</text>
</svg>
